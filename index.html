<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Tiki Social Club</title>
        <style>
            body {
                background-color: rgba(186, 106, 21, 0.77);
                font-family: Gravitas one, sans-serif;
            }

            .image-scroll {
                width: min(100%, 1200px);
                margin-inline: auto;
                overflow-x: auto;
                overscroll-behavior-x: contain;
                scrollbar-width: none;
            }

            .image-scroll::-webkit-scrollbar {
                display: none;
            }

            .image-scroll img {
                display: block;
                width: 1968px;
                max-width: none;
                height: auto;
            }
            h2 {
    text-align: center;
    font-size: 60px;
}
            h1 {
    text-align: center;
    font-size: 100px;
}
        </style>
    </head>
    <body>
        <h1>TIKI SOCIAL CLUB</h1>
        <div class="image-scroll" role="region" aria-label="Scrollable Tiki Social Club image" tabindex="0">
            <img src="https://cdn.hackclub.com/01a18552-a45d-7a53-a7b5-edd760ea5be9/rs_w_1968_h_394.webp" alt="Tiki Social Club">
        </div>
        <p style="text-align: center;"></p>
        <a href="https://www.etsy.com/shop/TikiSocialClub#items">
    <img src="https://cdn.hackclub.com/01a1856d-fc96-729c-ab81-af387f82091c/download.png" alt="Etsy">
</a>
        <script>
            const imageScroll = document.querySelector('.image-scroll');

            imageScroll.scrollLeft = (imageScroll.scrollWidth - imageScroll.clientWidth) / 2;
            imageScroll.addEventListener('wheel', (event) => {
                if (imageScroll.scrollWidth > imageScroll.clientWidth) {
                    event.preventDefault();
                    imageScroll.scrollLeft += event.deltaY || event.deltaX;
                }
            }, { passive: false });
        </script>
    </body>
</html>
